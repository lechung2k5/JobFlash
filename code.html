<style>

    ::-webkit-scrollbar {
      width: 4px;

<body class="bg-[#f3f0f8] text-[#1e1b26] antialiased min-h-screen flex flex-col items-center justify-center p-4 selection:bg-purple-200 selection:text-purple-900 overflow-x-hidden font-body-md">
<!-- Desktop Ambient Aura Background -->
<div class="fixed inset-0 pointer-events-none overflow-hidden -z-10 flex items-center justify-center">
<div class="absolute w-[650px] h-[650px] bg-purple-200/50 rounded-full blur-[140px] -top-32 -left-32"></div>
<div class="absolute w-[550px] h-[550px] bg-rose-200/40 rounded-full blur-[130px] -bottom-20 -right-20"></div>
<div class="absolute w-[450px] h-[450px] bg-fuchsia-200/35 rounded-full blur-[100px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
</div>
<!-- React Mount Point -->
<div class="w-full flex flex-col items-center justify-center" id="root"></div>
<!-- React Logic & UI Code -->
<script type="text/babel">
    const { useState, useEffect } = React;

    function Icon({ name, fill = false, className = "" }) {
      return (
        <span 
          className={`material-symbols-outlined select-none ${className}`}
          style={fill ? { fontVariationSettings: "'FILL' 1" } : {}}
        >
          {name}
        </span>
      );
    }

    function App() {
      // Core states
      const [currentScreen, setCurrentScreen] = useState('role-select');
      const [userRole, setUserRole] = useState(null); // 'requester' | 'worker'
      const [phone, setPhone] = useState('0912 345 678');
      const [otpSent, setOtpSent] = useState(false);
      const [otpValues, setOtpValues] = useState(['1', '2', '3', '4']);
      const [workerOnline, setWorkerOnline] = useState(true);
      const [jobCount, setJobCount] = useState(3);
      const [wageType, setWageType] = useState('package');
      const [showToast, setShowToast] = useState(null);
      const [chatMessages, setChatMessages] = useState([
        { id: 1, sender: 'worker', text: 'Chào anh, em đang chạy tới địa điểm bốc xếp đây ạ!' },
        { id: 2, sender: 'requester', text: 'Ok em nhé, cổng số 2 đường Nguyễn Hữu Thọ, tới alo anh.' },
        { id: 3, sender: 'worker', text: 'Dạ tầm 5 phút nữa em tới ngay ạ.' }
      ]);
      const [newMsg, setNewMsg] = useState('');

      const triggerToast = (msg) => {
        setShowToast(msg);
        setTimeout(() => setShowToast(null), 3200);
      };

      // Splash auto redirect simulation
      useEffect(() => {
        if (currentScreen === 'splash') {
          const timer = setTimeout(() => {
            setCurrentScreen('role-select');
          }, 2400);
          return () => clearTimeout(timer);
        }
      }, [currentScreen]);

      const handleSendChat = (e) => {
        e?.preventDefault();
        if (!newMsg.trim()) return;
        const msg = {
          id: Date.now(),
          sender: userRole === 'worker' ? 'worker' : 'requester',
          text: newMsg
        };
        setChatMessages(prev => [...prev, msg]);
        setNewMsg('');
      };

      // Helper for screens where BottomBar is contextual
      const isTopLevelRequester = ['req-home', 'shared-noti', 'shared-profile'].includes(currentScreen) && userRole === 'requester';
      const isTopLevelWorker = ['work-home', 'work-wallet', 'shared-profile'].includes(currentScreen) && userRole === 'worker';
      const showBottomBar = isTopLevelRequester || isTopLevelWorker;

      return (
        <div className="relative w-full flex flex-col items-center">
          
          {/* iOS Device Outer Frame with Premium Silver / Titanium Finish */}
          <div className="w-full max-w-[400px] h-[830px] relative overflow-hidden border-[7px] border-slate-800/90 rounded-[2.8rem] shadow-[0_25px_60px_-15px_rgba(79,42,120,0.25),0_15px_30px_rgba(0,0,0,0.12)] bg-[#faf8fc] flex flex-col text-slate-800">
            
            {/* Ambient Subtle Radial Glass Inside Screen */}
            <div className="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-100/40 via-transparent to-rose-50/30 z-0"></div>

            {/* iOS Status Bar & Dynamic Island (Light Mode) */}
            <div className="relative z-30 pt-3 px-6 pb-2 flex justify-between items-center bg-white/80 backdrop-blur-md border-b border-purple-100/50">
              <span className="text-[13px] font-title-md font-bold tracking-tight text-slate-800">09:41</span>
              
              {/* Dynamic Island Pill */}
              <div className="w-26 h-6 bg-slate-900 rounded-full flex items-center justify-between px-2.5 shadow-sm">
                <div className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div>
                <div className="flex items-center space-x-1">
                  <div className="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
                </div>
              </div>

              {/* Status Icons */}
              <div className="flex items-center space-x-1.5 text-slate-700">
                <Icon name="signal_cellular_alt" className="text-[14px]" />
                <Icon name="wifi" className="text-[14px]" />
                <Icon name="battery_full" className="text-[16px] text-emerald-600" fill={true} />
              </div>
            </div>

            {/* Discreet Reviewer Screen Selector Switcher */}
            <div className="relative z-30 px-3 py-1.5 bg-purple-50/90 backdrop-blur-md border-b border-purple-200/50 flex items-center justify-between gap-1 text-[11px]">
              <span className="font-label-xs text-purple-700 flex items-center gap-1 font-bold whitespace-nowrap">
                <Icon name="layers" className="text-sm" /> MÀN HÌNH:
              </span>
              <select 
                value={currentScreen} 
                onChange={(e) => {
                  const s = e.target.value;
                  setCurrentScreen(s);
                  if (s.startsWith('req-')) setUserRole('requester');
                  if (s.startsWith('work-')) setUserRole('worker');
                }}
                className="bg-white text-slate-800 rounded-full py-0.5 px-2 text-[11px] font-semibold border border-purple-200 shadow-sm focus:ring-1 focus:ring-purple-600 w-full max-w-[240px] truncate"
              >
                <option value="splash">1. Khởi động (Splash)</option>
                <option value="role-select">2. Chọn vai trò (Role Select)</option>
                <option value="login">3. Đăng nhập OTP (Login)</option>
                <option value="profile-setup">4. Cập nhật hồ sơ (Profile Setup)</option>
                <option value="req-home">5. [Thuê] Trang chủ (Req Home)</option>
                <option value="req-create">6. [Thuê] Đăng việc mới (Req Create)</option>
                <option value="req-radar">7. [Thuê] Radar tìm thợ (Req Radar)</option>
                <option value="req-tracking">8. [Thuê] Giám sát công việc (Req Tracking)</option>
                <option value="work-home">9. [Thợ] Bảng việc làm (Work Home)</option>
                <option value="work-alert">10. [Thợ] Nổ cuốc việc mới (Work Alert)</option>
                <option value="work-onduty">11. [Thợ] Đang thực hiện (Work OnDuty)</option>
                <option value="work-proof">12. [Thợ] Báo cáo nghiệm thu (Work Proof)</option>
                <option value="work-wallet">13. [Thợ] Ví thu nhập (Work Wallet)</option>
                <option value="shared-chat">14. [Chung] Chat đối tác (Shared Chat)</option>
                <option value="shared-noti">15. [Chung] Thông báo (Shared Noti)</option>
                <option value="shared-profile">16. [Chung] Hồ sơ cá nhân (Shared Profile)</option>
              </select>
            </div>

            {/* Top Notification Toast Floating Popup */}
            {showToast && (
              <div className="absolute top-20 left-4 right-4 z-50 bg-gradient-to-r from-purple-700 via-fuchsia-600 to-rose-600 text-white px-4 py-2.5 rounded-2xl shadow-[0_10px_25px_rgba(111,0,197,0.35)] flex items-center justify-between animate-bounce">
                <div className="flex items-center gap-2">
                  <Icon name="check_circle" className="text-xl" fill={true} />
                  <span className="text-xs font-semibold">{showToast}</span>
                </div>
                <button onClick={() => setShowToast(null)} className="text-white/80 hover:text-white">
                  <Icon name="close" className="text-sm" />
                </button>
              </div>
            )}

            {/* Main Interactive Screen Canvas Container */}
            <div className="flex-1 overflow-y-auto relative z-10 flex flex-col pb-16">
              
              {/* ============================================================== */}
              {/* SCREEN 1: SPLASH                                              */}
              {/* ============================================================== */}
              {currentScreen === 'splash' && (
                <div className="flex-1 flex flex-col justify-between items-center text-center p-8 bg-gradient-to-b from-purple-100 via-white to-pink-50 text-slate-800 relative overflow-hidden">
                  <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-purple-300/30 via-transparent to-transparent"></div>
                  
                  <div className="pt-20 z-10">
                    <div className="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-br from-purple-600 to-rose-500 p-0.5 shadow-[0_15px_35px_rgba(111,0,197,0.3)] flex items-center justify-center animate-pulse-slow">
                      <div className="w-full h-full bg-white rounded-3xl flex items-center justify-center">
                        <Icon name="bolt" className="text-5xl text-purple-600" fill={true} />
                      </div>
                    </div>
                  </div>

                  <div className="z-10 space-y-3">
                    <h1 className="font-headline-lg-mobile text-headline-lg-mobile tracking-tight text-slate-900 font-extrabold">
                      ThợNhanh <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-rose-600">247</span>
                    </h1>
                    <p className="font-title-md text-sm text-slate-600 font-medium">
                      Kết nối việc tức thì • Chuẩn chất lượng
                    </p>
                    <div className="flex items-center justify-center gap-2 pt-4">
                      <div className="w-2.5 h-2.5 rounded-full bg-purple-600 animate-ping"></div>
                      <span className="font-label-xs text-purple-700 text-xs font-semibold tracking-wider">Đang khởi tạo hệ thống...</span>
                    </div>
                  </div>

                  <div className="w-full z-10 pb-6">
                    <button 
                      onClick={() => setCurrentScreen('role-select')}
                      className="w-full py-4 rounded-full bg-gradient-to-r from-purple-600 via-fuchsia-600 to-rose-500 text-white font-headline-sm text-sm font-bold shadow-[0_15px_30px_rgba(181,0,92,0.3)] active:scale-95 transition-transform flex items-center justify-center gap-2"
                    >
                      <span>Bắt đầu trải nghiệm</span>
                      <Icon name="arrow_forward" className="text-base" />
                    </button>
                  </div>
                </div>
              )}

              {/* ============================================================== */}
              {/* SCREEN 2: ROLE SELECT                                         */}
              {/* ============================================================== */}
              {currentScreen === 'role-select' && (
                <div className="flex-1 flex flex-col justify-between p-6 bg-[#faf8fc]">
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-100 text-purple-700 font-label-xs font-bold mb-3 border border-purple-200">
                      <Icon name="verified" className="text-xs" />
                      <span>BƯỚC 1: CHỌN VAI TRÒ</span>
                    </div>
                    <h2 className="font-headline-lg-mobile text-headline-lg-mobile font-bold text-slate-900">
                      Bạn muốn làm gì?
                    </h2>
                    <p className="font-body-md text-sm text-slate-600 mt-1">
                      Linh hoạt chuyển đổi vai trò bất kỳ lúc nào ngay trong ứng dụng.
                    </p>
                  </div>

                  <div className="space-y-4 my-auto py-4">
                    {/* Role Card 1: Requester */}
                    <div 
                      onClick={() => {
                        setUserRole('requester');
                        setCurrentScreen('login');
                      }}
                      className="group cursor-pointer rounded-3xl p-5 bg-white border-2 border-purple-100 hover:border-purple-600 transition-all duration-300 shadow-[0_8px_24px_rgba(111,0,197,0.08)] hover:shadow-xl active:scale-95 relative overflow-hidden"
                    >
                      <div className="flex justify-between items-start mb-3">
                        <div className="w-12 h-12 rounded-2xl bg-purple-100 text-purple-700 flex items-center justify-center shadow-inner">
                          <Icon name="group" className="text-2xl" />
                        </div>
                        <span className="font-label-xs px-2.5 py-1 rounded-full bg-purple-50 text-purple-700 border border-purple-200 font-semibold">
                          Dành cho Cá nhân & DN
                        </span>
                      </div>
                      <h3 className="font-headline-sm text-lg text-slate-900 font-bold group-hover:text-purple-700 transition-colors">
                        Tôi muốn THUÊ NGƯỜI
                      </h3>
                      <p className="font-body-md text-xs text-slate-600 mt-1 leading-relaxed">
                        Đăng việc nhanh, thuê nhân sự sự kiện, bốc dỡ kho, phục vụ tiệc tức thì trong 15 phút.
                      </p>
                      <div className="mt-4 flex items-center text-purple-700 font-label-md text-xs font-bold">
                        <span>Tiếp tục với vai trò Thuê</span>
                        <Icon name="chevron_right" className="text-sm ml-1 group-hover:translate-x-1 transition-transform" />
                      </div>
                    </div>

                    {/* Role Card 2: Worker */}
                    <div 
                      onClick={() => {
                        setUserRole('worker');
                        setCurrentScreen('login');
                      }}
                      className="group cursor-pointer rounded-3xl p-5 bg-white border-2 border-rose-100 hover:border-rose-500 transition-all duration-300 shadow-[0_8px_24px_rgba(181,0,92,0.08)] hover:shadow-xl active:scale-95 relative overflow-hidden"
                    >
                      <div className="flex justify-between items-start mb-3">
                        <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center shadow-inner">
                          <Icon name="build" className="text-2xl" />
                        </div>
                        <span className="font-label-xs px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-200 font-semibold">
                          Thu nhập tức thì
                        </span>
                      </div>
                      <h3 className="font-headline-sm text-lg text-slate-900 font-bold group-hover:text-rose-600 transition-colors">
                        Tôi muốn NHẬN VIỆC
                      </h3>
                      <p className="font-body-md text-xs text-slate-600 mt-1 leading-relaxed">
                        Bật radar nhận việc gần bạn, linh hoạt thời gian, nhận tiền về ví ngay sau khi hoàn thành.
                      </p>
                      <div className="mt-4 flex items-center text-rose-600 font-label-md text-xs font-bold">
                        <span>Tiếp tục với vai trò Thợ</span>
                        <Icon name="chevron_right" className="text-sm ml-1 group-hover:translate-x-1 transition-transform" />
                      </div>
                    </div>
                  </div>

                  <div className="text-center font-body-md text-xs text-slate-500">
                    Bằng việc tiếp tục, bạn đồng ý với Điều khoản & Chính sách ThợNhanh 247.
                  </div>
                </div>
              )}

              {/* ============================================================== */}
              {/* SCREEN 3: LOGIN (OTP)                                         */}
              {/* ============================================================== */}
              {currentScreen === 'login' && (
                <div className="flex-1 flex flex-col justify-between p-6 bg-[#faf8fc]">
                  <div>
                    <button 
                      onClick={() => setCurrentScreen('role-select')} 
                      className="p-2 -ml-2 text-slate-600 hover:text-purple-700 transition-colors flex items-center gap-1 font-label-md"
                    >
                      <Icon name="arrow_back" className="text-xl" />
                      <span>Quay lại</span>
                    </button>

                    <div className="mt-4">
                      <span className="font-label-xs text-purple-700 font-bold uppercase tracking-wider">
                        {userRole === 'requester' ? 'Người Thuê Việc' : 'Đối Tác Thợ'}
                      </span>
                      <h2 className="font-headline-lg-mobile text-headline-lg-mobile font-bold text-slate-900 mt-1">
                        Đăng nhập nhanh
                      </h2>
                      <p className="font-body-md text-xs text-slate-600 mt-1">
                        Dùng số điện thoại để tiếp tục vào ứng dụng
                      </p>
                    </div>

                    <div className="mt-8 space-y-4">
                      <div>
                        <label className="font-label-md text-xs text-slate-700 font-semibold block mb-1.5">Số điện thoại (+84)</label>
                        <div className="relative flex items-center">
                          <span className="absolute left-4 text-slate-600 font-semibold text-sm">🇻🇳 +84</span>
                          <input 
                            type="text" 
                            value={phone}
                            onChange={(e) => setPhone(e.target.value)}
                            placeholder="0912 345 678"
                            className="w-full pl-20 pr-4 py-3.5 bg-white rounded-2xl border border-purple-200 text-slate-900 font-title-md text-sm focus:border-purple-600 focus:ring-2 focus:ring-purple-200 outline-none shadow-sm"
                          />
                        </div>
                      </div>

                      {!otpSent ? (
                        <button 
                          onClick={() => {
                            setOtpSent(true);
                            triggerToast("Mã OTP đã được gửi về số: " + phone);
                          }}
                          className="w-full mt-4 py-3.5 rounded-full bg-gradient-to-r from-purple-700 via-fuchsia-600 to-rose-600 text-white font-headline-sm text-sm font-bold shadow-[0_12px_24px_rgba(111,0,197,0.3)] active:scale-95 transition-transform"
                        >
                          Gửi mã xác nhận OTP
                        </button>

                      className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shadow-xs"
                    >
                      <Icon name="call" className="text-base" fill={true} />
                    </button>
                  </div>

                  {/* Messages Stream */}
                  <div className="flex-1 p-4 space-y-3 overflow-y-auto">
                    {chatMessages.map((msg) => {
                      const isMe = (userRole === 'worker' && msg.sender === 'worker') || 
                                   (userRole === 'requester' && msg.sender === 'requester');
                      return (
                        <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                          <div 
                            className={`max-w-[78%] px-4 py-2.5 rounded-2xl text-xs font-body-md leading-relaxed ${
                              isMe 
                                ? 'bg-gradient-to-r from-purple-700 to-rose-600 text-white rounded-br-sm shadow-sm' 
                                : 'bg-white text-slate-800 rounded-bl-sm border border-purple-100 shadow-xs'
                            }`}
                          >
                            {msg.text}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Input Box */}
                  <form onSubmit={handleSendChat} className="p-3 border-t border-purple-100 bg-white flex items-center gap-2 shadow-sm">
                    <button type="button" className="p-2 text-slate-500 hover:text-purple-700">
                      <Icon name="attach_file" className="text-lg" />
                    </button>
                    <input 
                      type="text" 
                      value={newMsg}
                      onChange={(e) => setNewMsg(e.target.value)}
                      placeholder="Nhắn tin cho đối tác..."
                      className="flex-1 px-4 py-2.5 bg-purple-50/50 rounded-full border border-purple-200 text-xs text-slate-800 focus:outline-none focus:border-purple-600 focus:bg-white"
                    />
                    <button 
                      type="submit"
                      className="w-9 h-9 rounded-full bg-gradient-to-r from-purple-700 to-rose-600 text-white flex items-center justify-center active:scale-90 shadow-sm"
                    >
                      <Icon name="send" className="text-sm" />
                    </button>
                  </form>
                </div>
              )}

              {/* ============================================================== */}
              {/* SCREEN 15: SHARED NOTIFICATIONS                               */}
              {/* ============================================================== */}
              {currentScreen === 'shared-noti' && (
                <div className="flex-1 flex flex-col bg-[#faf8fc] pb-20">
                  {/* Top Bar */}
                  <div className="p-4 border-b border-purple-100 flex items-center justify-between bg-white shadow-sm">
                    <button 
                      onClick={() => setCurrentScreen(userRole === 'worker' ? 'work-home' : 'req-home')}
                      className="p-1 text-slate-700 hover:text-purple-700 transition-colors flex items-center"
                    >
                      <Icon name="arrow_back" className="text-xl" />
                    </button>
                    <h3 className="font-headline-sm text-sm font-bold text-slate-900">Thông báo hệ thống</h3>
                    <span className="text-xs text-purple-700 font-bold">Đã đọc hết</span>
                  </div>

                  {/* Notification List */}
                  <div className="p-4 space-y-2.5">
                    {[
                      { icon: 'verified', color: 'text-emerald-600 bg-emerald-100', title: 'Nghiệm thu thành công', desc: 'Cuốc việc #892 đã được nghiệm thu và giải ngân hoàn tất!', time: '10 phút trước' },
                      { icon: 'local_offer', color: 'text-purple-700 bg-purple-100', title: 'Khuyến mãi cuối tuần', desc: 'Tặng 20% phí sàn dịch vụ cho người thuê trong tuần này.', time: '2 giờ trước' },
                      { icon: 'badge', color: 'text-amber-700 bg-amber-100', title: 'Xác minh hồ sơ hoàn tất', desc: 'CCCD của bạn đã được kiểm duyệt hợp lệ trên ThợNhanh 247.', time: '1 ngày trước' },
                    ].map((n, idx) => (
                      <div key={idx} className="p-3.5 rounded-2xl bg-white border border-purple-100 flex gap-3 items-start shadow-xs">
                        <div className={`mt-0.5 p-2 rounded-xl ${n.color}`}>
                          <Icon name={n.icon} className="text-lg" fill={true} />
                        </div>
                        <div className="flex-1">
                          <h4 className="text-xs font-bold text-slate-900">{n.title}</h4>
                          <p className="text-[11px] text-slate-600 mt-0.5">{n.desc}</p>
                          <span className="text-[9px] text-slate-400 block mt-1">{n.time}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ============================================================== */}
              {/* SCREEN 16: SHARED PROFILE                                     */}
              {/* ============================================================== */}
              {currentScreen === 'shared-profile' && (
                <div className="flex-1 flex flex-col bg-[#faf8fc] pb-20">
                  {/* Top Bar */}
                  <div className="p-4 border-b border-purple-100 flex items-center justify-between bg-white shadow-sm">
                    <h3 className="font-headline-sm text-sm font-bold text-slate-900">Tài khoản của tôi</h3>
                    <button 
                      onClick={() => {
                        const newR = userRole === 'worker' ? 'requester' : 'worker';
                        setUserRole(newR);
                        triggerToast(`Đã chuyển sang vai trò: ${newR === 'worker' ? 'Thợ' : 'Người Thuê'}`);
                        setCurrentScreen(newR === 'worker' ? 'work-home' : 'req-home');
                      }}
                      className="px-2.5 py-1 rounded-full bg-purple-100 text-purple-800 text-[10px] font-bold border border-purple-200 shadow-xs"
                    >
                      Đổi sang {userRole === 'worker' ? 'Thuê việc' : 'Làm thợ'} 🔄
                    </button>
                  </div>

                  {/* Profile Summary Card */}
                  <div className="p-5">
                    <div className="p-5 rounded-3xl bg-white border border-purple-100 flex items-center gap-4 shadow-sm">
                      <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-purple-600 to-rose-500 p-0.5 shadow-sm">
                        <div className="w-full h-full rounded-full bg-purple-50 flex items-center justify-center">
                          <Icon name="person" className="text-3xl text-purple-700" />
                        </div>
                      </div>
                      <div>
                        <h4 className="font-headline-sm text-sm font-bold text-slate-900">Nguyễn Hoàng Long</h4>
                        <span className="text-xs text-slate-500 block mt-0.5">0912 345 678</span>
                        <div className="flex items-center gap-1.5 mt-1 text-[11px] text-amber-600 font-bold">
                          <span>★ 4.9</span>
                          <span className="text-slate-500 font-normal">• Thành viên VIP</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Settings Menu Options */}
                  <div className="px-5 space-y-2">
                    {[
                      { icon: 'history', label: 'Lịch sử công việc' },
                      { icon: 'credit_card', label: 'Phương thức thanh toán & Ví' },
                      { icon: 'notifications', label: 'Cài đặt thông báo' },
                      { icon: 'support_agent', label: 'Trung tâm trợ giúp 24/7' },
                      { icon: 'policy', label: 'Điều khoản & Chính sách' },
                    ].map((item, idx) => (
                      <div 
                        key={idx} 
                        onClick={() => triggerToast(`Mở mục: ${item.label}`)}
                        className="p-3.5 rounded-2xl bg-white hover:bg-purple-50/50 border border-purple-50 cursor-pointer flex items-center justify-between text-xs text-slate-800 shadow-xs"
                      >
                        <div className="flex items-center gap-3">
                          <Icon name={item.icon} className="text-purple-700 text-base" />
                          <span className="font-semibold">{item.label}</span>
                        </div>
                        <Icon name="chevron_right" className="text-slate-400 text-base" />
                      </div>
                    ))}
                  </div>

                  {/* Sign Out Button */}
                  <div className="p-5 mt-auto">
                    <button 
                      onClick={() => {
                        setUserRole(null);
                        setCurrentScreen('role-select');
                        triggerToast("Đã đăng xuất tài khoản an toàn.");
                      }}
                      className="w-full py-3.5 rounded-full border border-rose-300 text-rose-700 font-headline-sm text-xs font-bold hover:bg-rose-50 active:scale-95 transition-all shadow-xs"
                    >
                      ĐĂNG XUẤT TÀI KHOẢN
                    </button>
                  </div>
                </div>
              )}

            </div>

            {/* ============================================================== */}
            {/* SHARED COMPONENT: BOTTOM NAVBAR (LIGHT GLASSMORPHISM)         */}
            {/* ============================================================== */}
            {showBottomBar && (
              <div className="fixed bottom-0 left-0 right-0 max-w-[368px] mx-auto mb-6 z-50 flex justify-around items-center px-space-xs py-space-2xs bg-white/90 backdrop-blur-2xl rounded-full border border-purple-100 shadow-[0_12px_35px_rgba(111,0,197,0.15)]">
                
                {/* Tab 1: Explore / Home */}
                <button 
                  onClick={() => setCurrentScreen(userRole === 'worker' ? 'work-home' : 'req-home')}
                  className={`transition-all duration-200 ${
                    ['req-home', 'work-home'].includes(currentScreen)
                      ? "flex flex-col items-center justify-center bg-purple-100 text-purple-800 rounded-full px-3 py-1.5 shadow-xs font-bold"
                      : "flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-purple-700"
                  }`}
                >
                  <Icon name="explore" className="text-lg" />
                  <span className="text-[10px] font-bold mt-0.5">Explore</span>
                </button>

                {/* Tab 2: Requests / Wallet */}
                <button 
                  onClick={() => setCurrentScreen(userRole === 'worker' ? 'work-wallet' : 'req-tracking')}
                  className={`transition-all duration-200 ${
                    ['work-wallet', 'req-tracking'].includes(currentScreen)
                      ? "flex flex-col items-center justify-center bg-purple-100 text-purple-800 rounded-full px-3 py-1.5 shadow-xs font-bold"
                      : "flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-purple-700"
                  }`}
                >
                  <Icon name="token" className="text-lg" />
                  <span className="text-[10px] font-bold mt-0.5">Requests</span>
                </button>

                {/* Tab 3: Pulse / Radar */}
                <button 
                  onClick={() => setCurrentScreen(userRole === 'worker' ? 'work-alert' : 'req-radar')}
                  className={`transition-all duration-200 ${
                    ['req-radar', 'work-alert'].includes(currentScreen)
                      ? "flex flex-col items-center justify-center bg-purple-100 text-purple-800 rounded-full px-3 py-1.5 shadow-xs font-bold"
                      : "flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-purple-700"
                  }`}
                >
                  <Icon name="radar" className="text-lg" />
                  <span className="text-[10px] font-bold mt-0.5">Pulse</span>
                </button>

                {/* Tab 4: Profile */}
                <button 
                  onClick={() => setCurrentScreen('shared-profile')}
                  className={`transition-all duration-200 ${
                    currentScreen === 'shared-profile'
                      ? "flex flex-col items-center justify-center bg-purple-100 text-purple-800 rounded-full px-3 py-1.5 shadow-xs font-bold"
                      : "flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-purple-700"
                  }`}
                >
                  <Icon name="account_circle" className="text-lg" />
                  <span className="text-[10px] font-bold mt-0.5">Profile</span>
                </button>

              </div>
            )}

            {/* iOS Bottom Home Indicator Bar (Light Mode) */}
            <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-400/50 rounded-full z-40 pointer-events-none"></div>

          </div>
        </div>
      );
    }

    // Render React App into Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body></html>
