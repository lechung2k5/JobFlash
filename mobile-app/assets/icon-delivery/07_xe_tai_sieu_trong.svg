<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Nền tròn pastel dịu mắt -->
  <circle cx="40" cy="40" r="38" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1.5"/>
  <!-- Thùng Container chở hàng trên sơ mi rơ moóc -->
  <rect x="10" y="21" width="41" height="27" rx="1.5" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Gân dập sóng Container dọc chuẩn logistics -->
  <line x1="16" y1="23" x2="16" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <line x1="22" y1="23" x2="22" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <line x1="28" y1="23" x2="28" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <line x1="34" y1="23" x2="34" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <line x1="40" y1="23" x2="40" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <line x1="46" y1="23" x2="46" y2="46" stroke="#38BDF8" stroke-width="1"/>
  <!-- Khớp nối mâm kéo -->
  <rect x="50" y="44" width="4" height="4" fill="#0F172A"/>
  <!-- Đầu kéo Container (Tractor) -->
  <path d="M53 23 H62 C64.5 23 66.5 25 67.5 28 L70 36 V48 H53 Z" fill="#2563EB"/>
  <!-- Ống xả thẳng đứng đặc trưng sau cabin -->
  <rect x="52" y="18" width="2" height="12" rx="0.5" fill="#94A3B8"/>
  <!-- Kính cabin -->
  <path d="M56 25 H62 L66 34 H56 Z" fill="#BAE6FD"/>
  <!-- Đèn & Cản bảo vệ -->
  <rect x="68" y="41" width="3" height="5" rx="0.5" fill="#FDE047"/>
  <!-- Hệ thống khung gầm nhiều trục -->
  <rect x="8" y="48" width="63" height="3" fill="#0F172A"/>
  <!-- 3 cụm bánh sau chịu tải nặng + 1 bánh trước lái -->
  <circle cx="16" cy="53" r="6.5" fill="#334155"/>
  <circle cx="16" cy="53" r="3" fill="#CBD5E1"/>
  <circle cx="25" cy="53" r="6.5" fill="#334155"/>
  <circle cx="25" cy="53" r="3" fill="#CBD5E1"/>
  <circle cx="34" cy="53" r="6.5" fill="#334155"/>
  <circle cx="34" cy="53" r="3" fill="#CBD5E1"/>
  <circle cx="61" cy="53" r="6.5" fill="#334155"/>
  <circle cx="61" cy="53" r="3" fill="#CBD5E1"/>
</svg>
