<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Nền tròn pastel dịu mắt -->
  <circle cx="40" cy="40" r="38" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1.5"/>
  <!-- Thùng xe tải trung (dài và cao hơn) -->
  <rect x="14" y="24" width="36" height="24" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Đường gân gia cố thùng xe -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="14" y1="40" x2="50" y2="40" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Mui lướt gió trên nóc cabin -->
  <path d="M52 24 L60 27 V29 H52 Z" fill="#1D4ED8"/>
  <!-- Cabin xe tải -->
  <path d="M52 29 H61 C63 29 65 31 66 33 L68 39 C68.5 40.5 69 42 69 44 V48 H52 Z" fill="#2563EB"/>
  <!-- Kính cabin -->
  <path d="M54 31 H61 L65 38 H54 Z" fill="#BAE6FD"/>
  <!-- Đèn & Mặt ca lăng -->
  <rect x="67" y="42" width="3" height="4" rx="0.5" fill="#FDE047"/>
  <line x1="56" y1="44" x2="65" y2="44" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Khung gầm & Thanh chắn hông bảo hiểm -->
  <path d="M12 48 H19 C19 44 27 44 27 48 H50 C50 44 58 44 58 48 H70 V51 H12 Z" fill="#1E293B"/>
  <line x1="29" y1="49" x2="48" y2="49" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Bánh xe -->
  <circle cx="23" cy="52" r="8" fill="#334155"/>
  <circle cx="23" cy="52" r="4" fill="#CBD5E1"/>
  <circle cx="23" cy="52" r="1.5" fill="#1E293B"/>
  <circle cx="54" cy="52" r="8" fill="#334155"/>
  <circle cx="54" cy="52" r="4" fill="#CBD5E1"/>
  <circle cx="54" cy="52" r="1.5" fill="#1E293B"/>
</svg>
