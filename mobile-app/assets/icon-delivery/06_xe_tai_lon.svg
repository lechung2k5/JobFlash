<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Nền tròn pastel dịu mắt -->
  <circle cx="40" cy="40" r="38" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1.5"/>
  <!-- Thùng xe tải hạng nặng lớn -->
  <rect x="12" y="22" width="40" height="26" rx="2" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <line x1="12" y1="31" x2="52" y2="31" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="12" y1="39" x2="52" y2="39" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Mui cabin cao có kính chắn nắng -->
  <path d="M54 22 L63 26 H54 Z" fill="#1E40AF"/>
  <path d="M54 26 H63 C65 26 67 28 68 31 L70 38 V48 H54 Z" fill="#1D4ED8"/>
  <!-- Kính cabin lớn -->
  <path d="M56 28 H63 L66 36 H56 Z" fill="#BAE6FD"/>
  <!-- Ca lăng mạ & Đèn -->
  <rect x="68" y="41" width="3" height="5" rx="0.5" fill="#FDE047"/>
  <rect x="58" y="42" width="8" height="4" rx="0.5" fill="#94A3B8"/>
  <!-- Khung gầm trục kép sau -->
  <path d="M10 48 H16 C16 44 32 44 32 48 H52 C52 44 60 44 60 48 H71 V51 H10 Z" fill="#1E293B"/>
  <!-- Bánh xe: Trục kép chịu tải sau + 1 bánh trước -->
  <circle cx="20" cy="52" r="7.5" fill="#334155"/>
  <circle cx="20" cy="52" r="3.5" fill="#CBD5E1"/>
  <circle cx="28" cy="52" r="7.5" fill="#334155"/>
  <circle cx="28" cy="52" r="3.5" fill="#CBD5E1"/>
  <circle cx="56" cy="52" r="7.5" fill="#334155"/>
  <circle cx="56" cy="52" r="3.5" fill="#CBD5E1"/>
</svg>
