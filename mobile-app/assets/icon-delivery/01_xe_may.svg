  <path d="M46 36 L54 36 L58 48 H52 L48 40 Z" fill="#3B82F6"/>
  <line x1="52" y1="36" x2="50" y2="32" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="54" y2="32" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Đèn pha -->
  <circle cx="58" cy="44" r="2.5" fill="#FDE047"/>
  <!-- Bánh sau -->
  <circle cx="28" cy="56" r="9" fill="#334155"/>
  <circle cx="28" cy="56" r="4.5" fill="#CBD5E1"/>
  <circle cx="28" cy="56" r="2" fill="#1E293B"/>
  <!-- Bánh trước -->
  <circle cx="56" cy="56" r="9" fill="#334155"/>
  <circle cx="56" cy="56" r="4.5" fill="#CBD5E1"/>
  <circle cx="56" cy="56" r="2" fill="#1E293B"/>
  <!-- Sàn để chân -->
  <line x1="38" y1="54" x2="48" y2="54" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
