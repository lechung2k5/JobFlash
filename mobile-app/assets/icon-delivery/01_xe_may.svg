  <rect x="18" y="24" width="20" height="18" rx="3" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <line x1="18" y1="30" x2="38" y2="30" stroke="#D97706" stroke-width="1.5"/>
  <rect x="25" y="33" width="6" height="5" rx="1" fill="#FEF3C7"/>
  <!-- Yên xe & Khung thân xe -->
  <path d="M36 38 H46 L50 48 H36 Z" fill="#1E293B"/>
  <path d="M26 44 L38 46 L44 54 H30 L26 44 Z" fill="#2563EB"/>
